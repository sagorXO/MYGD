version: "3.8"

services:
  kiosk-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mygd-kiosk-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/menu || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mygd-sqlite-data:
    name: mygd-kiosk-sqlite-storage
