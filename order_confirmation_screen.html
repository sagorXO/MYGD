<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY GERMAN DÖNER - Order Confirmed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF5722',
              'orange-hover': '#F4511E',
              green: '#4CAF50',
              dark: '#1A1A1A',
              card: '#242424',
              surface: '#2D2D2D',
              border: '#333333',
              muted: '#9E9E9E',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #121212;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .ticket-card {
      position: relative;
      background: #242424;
      border: 1px solid #333333;
      border-radius: 20px;
    }
    
    .ticket-card::before, .ticket-card::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 24px;
      height: 24px;
      background: #1A1A1A;
      border-radius: 50%;
      transform: translateY(-50%);
    }
    .ticket-card::before {
      left: -13px;
      border-right: 1px solid #333333;
    }
    .ticket-card::after {
      right: -13px;
      border-left: 1px solid #333333;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(76, 175, 80, 0.4), inset 0 0 15px rgba(76, 175, 80, 0.2);
      }
      50% {
        box-shadow: 0 0 45px rgba(76, 175, 80, 0.7), inset 0 0 25px rgba(76, 175, 80, 0.4);
      }
    }

    .success-badge {
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes spin-slow {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }

    @keyframes print-indicator {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .dot-1 { animation: print-indicator 1.4s infinite 0.1s; }
    .dot-2 { animation: print-indicator 1.4s infinite 0.3s; }
    .dot-3 { animation: print-indicator 1.4s infinite 0.5s; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-black text-white">

  <!-- Mobile / Portrait Kiosk Container (1080x1920 scaled or mobile viewport) -->
  <main class="w-full max-w-[440px] min-h-[820px] bg-brand-dark rounded-[36px] shadow-2xl border border-[#2c2c2c] overflow-hidden flex flex-col justify-between p-8 relative">

    <!-- Top Glow Effect -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 bg-[#4CAF50]/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header & Success Icon -->
    <header class="flex flex-col items-center text-center mt-4 z-10">
      <!-- 80px Green Checkmark Circle -->
      <div class="w-20 h-20 rounded-full bg-[#1b3320] border-2 border-brand-green flex items-center justify-center success-badge mb-6">
        <svg class="w-10 h-10 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <!-- Large Order Confirmed Title -->
      <h1 class="text-[28px] font-extrabold tracking-tight text-white uppercase mb-2">
        ORDER CONFIRMED!
      </h1>
      <p class="text-sm font-medium text-[#A0A0A0]">
        Thank you for ordering with <span class="text-white font-semibold">MY GERMAN DÖNER</span>
      </p>
    </header>

    <!-- Center Section: Ticket & Wait Info -->
    <section class="flex flex-col gap-4 my-6 z-10">
      <!-- Ticket Container -->
      <div class="ticket-card p-6 flex flex-col items-center text-center shadow-lg">
        <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-brand-muted mb-2">
          Your Order Number
        </span>
        
        <!-- Giant Order Number -->
        <div class="font-mono text-[34px] sm:text-[38px] font-extrabold text-brand-orange tracking-wider leading-none py-2 drop-shadow-sm">
          EMBA-20260815-1423-047
        </div>

        <div class="w-full h-px border-t border-dashed border-[#3A3A3A] my-4"></div>

        <!-- Wait Time -->
        <div class="flex items-center gap-2 text-white/90 text-[17px] font-semibold">
          <svg class="w-5 h-5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Estimated wait: <span class="text-white font-bold">~8 minutes</span></span>
        </div>
      </div>

      <!-- Receipt Printer Status -->
      <div class="bg-[#242424] border border-brand-border rounded-xl py-3 px-5 flex items-center justify-center gap-3 text-brand-muted text-sm font-medium">
        <svg class="w-5 h-5 text-brand-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span class="flex items-center gap-1">
          Receipt printing
          <span class="flex gap-0.5 ml-0.5">
            <span class="dot-1 inline-block w-1 h-1 rounded-full bg-brand-muted"></span>
            <span class="dot-2 inline-block w-1 h-1 rounded-full bg-brand-muted"></span>
            <span class="dot-3 inline-block w-1 h-1 rounded-full bg-brand-muted"></span>
          </span>
        </span>
      </div>
    </section>

    <!-- Circular Countdown Timer Section -->
    <section class="flex flex-col items-center justify-center my-2 z-10">
      <div class="relative w-32 h-32 flex items-center justify-center">
        <!-- SVG Progress Ring -->
        <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
          <!-- Background track -->
          <circle
            cx="60"
            cy="60"
            r="50"
            stroke="#333333"
            stroke-width="8"
            fill="transparent"
          />
          <!-- Active orange progress ring -->
          <circle
            id="progress-circle"
            cx="60"
            cy="60"
            r="50"
            stroke="#FF5722"
            stroke-width="8"
            stroke-linecap="round"
            fill="transparent"
            stroke-dasharray="314.159"
            stroke-dashoffset="0"
            style="transition: stroke-dashoffset 1s linear;"
          />
        </svg>

        <!-- Centered Timer Text -->
        <div class="absolute flex flex-col items-center justify-center text-center">
          <span class="text-xs font-semibold text-[#8E8E8E] uppercase tracking-wider">New order in</span>
          <span id="countdown-number" class="text-2xl font-black text-white font-mono mt-0.5">12s</span>
        </div>
      </div>
    </section>

    <!-- Bottom Action Button -->
    <footer class="mt-4 z-10">
      <button
        onclick="resetKiosk()"
        class="w-full py-4 px-6 bg-brand-orange hover:bg-brand-orange-hover active:scale-[0.98] transition-all duration-150 rounded-2xl font-extrabold text-white text-lg tracking-wider uppercase shadow-lg shadow-brand-orange/30 flex items-center justify-center gap-2"
      >
        <span>START NEW ORDER</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </footer>

  </main>

  <script>
    // Live Countdown Timer logic for Kiosk Display
    let timeLeft = 12;
    const totalTime = 12;
    const circle = document.getElementById('progress-circle');
    const number = document.getElementById('countdown-number');
    const circumference = 2 * Math.PI * 50; // ~314.159

    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        resetKiosk();
      } else {
        number.textContent = `${timeLeft}s`;
        const offset = circumference - (timeLeft / totalTime) * circumference;
        circle.style.strokeDashoffset = offset;
      }
    }, 1000);

    function resetKiosk() {
      // Simulate kiosk reset
      window.location.reload();
    }
  </script>
</body>
</html>
